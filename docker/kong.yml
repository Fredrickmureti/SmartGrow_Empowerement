# Kong API Gateway Configuration for Supabase Local Development
# This file configures routing for all Supabase services

_format_version: "2.1"
_transform: true

services:
  # ==========================================================================
  # Auth Service (GoTrue)
  # ==========================================================================
  - name: auth-v1
    url: http://supabase-auth:9999/
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
          exposed_headers:
            - Content-Length
            - Content-Range
          max_age: 3600
          credentials: true

  # ==========================================================================
  # PostgREST API
  # ==========================================================================
  - name: rest-v1
    url: http://supabase-rest:3000/
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - Prefer
            - Range
          exposed_headers:
            - Content-Length
            - Content-Range
          max_age: 3600
          credentials: true
      - name: key-auth
        config:
          key_names:
            - apikey
          key_in_query: true
          key_in_header: true
          hide_credentials: false

  # ==========================================================================
  # Realtime Service
  # ==========================================================================
  - name: realtime-v1
    url: http://supabase-realtime:4000/socket/
    routes:
      - name: realtime-v1-route
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"

  # ==========================================================================
  # Storage Service
  # ==========================================================================
  - name: storage-v1
    url: http://supabase-storage:5000/
    routes:
      - name: storage-v1-route
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - x-upsert
          exposed_headers:
            - Content-Length
          max_age: 3600
          credentials: true

  # ==========================================================================
  # Meta Service (for Studio)
  # ==========================================================================
  - name: meta
    url: http://supabase-meta:8080/
    routes:
      - name: meta-route
        strip_path: true
        paths:
          - /pg/

