# Kustomization for development overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: accrualflow-dev

# Inherit from base
resources:
  - ../../base

# Development-specific name suffix
nameSuffix: -dev

# Common labels for dev environment
commonLabels:
  app.kubernetes.io/environment: development

# Override replicas for dev
replicas:
  - name: accrualflow-web
    count: 1

# Patches for development
patches:
  # Reduce resource requests/limits for dev
  - target:
      kind: Deployment
      name: accrualflow-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
  
  # Use NodePort for dev (easier local access)
  - target:
      kind: Service
      name: accrualflow-web
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080

# ConfigMap overrides for dev
configMapGenerator:
  - name: accrualflow-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - ENABLE_ANALYTICS=false
