# Kustomization for production overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: accrualflow

# Inherit from base
resources:
  - ../../base
  - hpa.yaml
  - pdb.yaml

# Common labels for production
commonLabels:
  app.kubernetes.io/environment: production

# Production replicas
replicas:
  - name: accrualflow-web
    count: 3

# Production image (override with actual image)
images:
  - name: accrualflow
    newName: your-registry.com/accrualflow
    newTag: latest

# Patches for production
patches:
  # Increase resources for production
  - target:
      kind: Deployment
      name: accrualflow-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
  
  # Production ingress hostname
  - target:
      kind: Ingress
      name: accrualflow-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.accrualflow.com
      - op: replace
        path: /spec/tls/0/hosts/0
        value: app.accrualflow.com

# ConfigMap overrides for production
configMapGenerator:
  - name: accrualflow-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - ENABLE_ANALYTICS=true
      - ENABLE_ERROR_TRACKING=true
