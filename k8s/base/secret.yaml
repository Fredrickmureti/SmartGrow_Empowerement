# AccrualFlow Secrets Template
# DO NOT commit actual secrets! This is a template.
# 
# Create secrets manually:
#   kubectl create secret generic accrualflow-secrets \
#     --from-literal=SUPABASE_URL=https://xxx.supabase.co \
#     --from-literal=SUPABASE_ANON_KEY=eyJxxx \
#     -n accrualflow
#
# Or use external secret management (Sealed Secrets, External Secrets, etc.)

apiVersion: v1
kind: Secret
metadata:
  name: accrualflow-secrets
  namespace: accrualflow
  labels:
    app.kubernetes.io/name: accrualflow
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Required - Replace with actual values
  SUPABASE_URL: "https://your-project.supabase.co"
  SUPABASE_ANON_KEY: "your-anon-key-here"
  
  # Optional
  SENTRY_DSN: ""
