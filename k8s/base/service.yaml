# AccrualFlow Service
apiVersion: v1
kind: Service
metadata:
  name: accrualflow-web
  namespace: accrualflow
  labels:
    app.kubernetes.io/name: accrualflow
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: accrualflow
    app.kubernetes.io/component: web
